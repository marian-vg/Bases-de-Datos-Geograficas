name: bd-geograficas

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: bdg_entrerios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/preparar.sh first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
      - ./actividades-sql:/actividades-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bdg_entrerios"]
      interval: 5s
      timeout: 5s
      retries: 30

  pgadmin:
    image: dpage/pgadmin4:9.9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-usuario@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Run ./scripts/preparar.sh first}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  gdal:
    image: ghcr.io/osgeo/gdal:ubuntu-small-3.12.4
    profiles: [tools]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: bdg_entrerios
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/preparar.sh first}
    volumes:
      - ./shapes:/data:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
